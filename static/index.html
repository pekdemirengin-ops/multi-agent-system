<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 30px;
        }
        header h1 { font-size: 24px; margin-bottom: 4px; }
        header p { opacity: 0.9; font-size: 14px; }
        .agents-bar {
            display: flex;
            gap: 8px;
            padding: 16px 20px;
            background: #f7f7fa;
            overflow-x: auto;
            border-bottom: 1px solid #e5e5ea;
        }
        .agent-btn {
            padding: 8px 16px;
            border: 2px solid #e5e5ea;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .agent-btn:hover { border-color: #667eea; color: #667eea; }
        .agent-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #f0f0f5;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.assistant code {
            background: #e0e0e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .message.assistant pre {
            background: #2d2d3a;
            color: #f0f0f5;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
        }
        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
            font-size: 13px;
        }
        .sources a {
            display: block;
            color: #667eea;
            text-decoration: none;
            margin: 4px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sources a:hover { text-decoration: underline; }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e5ea;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e5e5ea;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #667eea; }
        button.send {
            padding: 14px 28px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.send:hover { background: #5568d3; }
        button.send:disabled { background: #ccc; cursor: not-allowed; }
        .status {
            font-size: 12px;
            color: #888;
            padding: 4px 20px 0;
            min-height: 20px;
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Multi-Agent System</h1>
            <p>7 agent, tek arayuz. Sorunuzu yazin.</p>
        </header>
        <div class="agents-bar" id="agentsBar"></div>
        <div class="status">
            <span class="dot"></span>
            <span id="statusText">Baglaniyor...</span>
        </div>
        <div class="chat" id="chat">
            <div class="message assistant">
Multi-Agent System'e hos geldiniz!
Bir agent secin ve sorunuzu yazin.
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Sorunuzu yazin..." autocomplete="off">
            <button class="send" id="sendBtn">Gonder</button>
        </div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        let currentAgent = "researcher";
        let isProcessing = false;
        const chat = document.getElementById("chat");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const agentsBar = document.getElementById("agentsBar");
        const statusText = document.getElementById("statusText");

        async function loadAgents() {
            try {
                const res = await fetch(`${API_BASE}/api/agents`);
                const data = await res.json();
                agentsBar.innerHTML = "";
                data.agents.forEach((agent) => {
                    const btn = document.createElement("button");
                    btn.className = "agent-btn" + (agent.name === currentAgent ? " active" : "");
                    btn.textContent = agent.name;
                    btn.onclick = () => {
                        currentAgent = agent.name;
                        document.querySelectorAll(".agent-btn").forEach((b) => b.classList.remove("active"));
                        btn.classList.add("active");
                    };
                    agentsBar.appendChild(btn);
                });
                statusText.textContent = `${data.count} agent hazir`;
            } catch (e) {
                statusText.textContent = "Baglanti hatasi";
            }
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMarkdown(text) {
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) => {
                return `<pre>${escapeHtml(code.trim())}</pre>`;
            });
            text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
            text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            return text;
        }

        function addMessage(text, role, sources) {
            const div = document.createElement("div");
            div.className = `message ${role}`;
            if (role === "assistant") {
                div.innerHTML = formatMarkdown(text);
                if (sources && sources.length > 0) {
                    const sourcesDiv = document.createElement("div");
                    sourcesDiv.className = "sources";
                    sourcesDiv.innerHTML = "<strong>Kaynaklar:</strong>";
                    sources.forEach((s, i) => {
                        const a = document.createElement("a");
                        a.href = s.url;
                        a.target = "_blank";
                        a.textContent = `${i + 1}. ${s.title}`;
                        sourcesDiv.appendChild(a);
                    });
                    div.appendChild(sourcesDiv);
                }
            } else {
                div.textContent = text;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isProcessing) return;
            isProcessing = true;
            sendBtn.disabled = true;
            messageInput.value = "";
            addMessage(message, "user");
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message assistant";
            loadingDiv.textContent = "Dusunuyor...";
            chat.appendChild(loadingDiv);
            chat.scrollTop = chat.scrollHeight;
            try {
                const res = await fetch(`${API_BASE}/api/ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: message,
                        agent: currentAgent,
                        timeout: 60
                    })
                });
                loadingDiv.remove();
                if (!res.ok) {
                    const err = await res.json();
                    addMessage(`Hata: ${err.detail || "Bilinmeyen hata"}`, "assistant");
                } else {
                    const data = await res.json();
                    addMessage(data.answer, "assistant", data.sources);
                }
            } catch (e) {
                loadingDiv.remove();
                addMessage(`Baglanti hatasi: ${e.message}`, "assistant");
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        sendBtn.onclick = sendMessage;
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
        loadAgents();
        messageInput.focus();
    </script>
</body>
</html>

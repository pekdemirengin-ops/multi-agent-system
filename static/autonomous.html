<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autonomous Agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
min-height: 100vh; padding: 20px; }
.container { background: white; border-radius: 20px;
box-shadow: 0 20px 60px rgba(0,0,0,0.3);
max-width: 900px; margin: 0 auto; padding: 30px; }
h1 { color: #333; margin-bottom: 8px; font-size: 24px; }
.subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
.examples { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.example-btn { padding: 8px 14px; border: 2px solid #e5e5ea;
background: white; border-radius: 20px; cursor: pointer;
font-size: 12px; font-weight: 500; color: #555; }
.example-btn:hover { border-color: #667eea; color: #667eea; }
.input-area { display: flex; gap: 10px; margin-bottom: 20px; }
.input-area input { flex: 1; padding: 14px 18px; border: 2px solid #e5e5ea;
border-radius: 12px; font-size: 15px; outline: none; }
.input-area button { padding: 14px 28px; background: #667eea; color: white;
border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.plan-box { background: #f7f7fa; border-radius: 12px; padding: 16px;
margin-bottom: 16px; display: none; }
.plan-box.visible { display: block; }
.step { border: 1px solid #e5e5ea; border-radius: 12px; padding: 14px;
margin-bottom: 10px; background: #fafafc; }
.step-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
.step-name { font-weight: 700; color: #333; font-size: 13px; }
.step-status { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 10px; }
.step-status.pending { background: #fef3c7; color: #92400e; }
.step-status.done { background: #d1fae5; color: #065f46; }
.step-status.error { background: #fee2e2; color: #991b1b; }
.step-content { font-size: 12px; color: #555; line-height: 1.5;
white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
.report { margin-top: 24px; padding: 20px;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
border-radius: 12px; color: white; }
.report h2 { font-size: 18px; margin-bottom: 12px;
border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 8px; }
.report-content { font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
.report-meta { margin-top: 16px; padding-top: 12px;
border-top: 1px solid rgba(255,255,255,0.3); font-size: 12px; }
.loading { text-align: center; padding: 20px; color: #888; }
.back-link { display: inline-block; margin-bottom: 20px; color: #667eea;
text-decoration: none; font-size: 14px; font-weight: 600; }

.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.temizle-btn { padding: 8px 16px; background: #ef4444; color: white;
border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
cursor: pointer; transition: background 0.2s; }
.temizle-btn:hover { background: #dc2626; }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="/" class="back-link"> Ana Sayfa</a>
        <button class="temizle-btn" onclick="temizle()"> Temizle</button>
    </div>
    <h1> Autonomous Agent</h1>
    <p class="subtitle">Hedef ver  kendi planlar  adım adım çalıştırır  rapor yazar</p>

    <div class="examples" id="examples"></div>

    <div class="input-area">
        <input type="text" id="goalInput" placeholder="Hedefinizi yazın..." autocomplete="off">
        <button id="runBtn" onclick="runAutonomous()">Çalıştır</button>
    </div>

    <div class="plan-box" id="planBox">
        <h3> Plan</h3>
        <ul class="plan-steps" id="planSteps"></ul>
    </div>

    <div id="researchList" class="research-list"></div>
</div>

<script>
const API_BASE = window.location.origin;
let token = localStorage.getItem("token");
if (!token) { window.location.href = "/"; }
function authHeaders() {
    return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
}

async function loadExamples() {
    try {
        const res = await fetch(`${API_BASE}/api/autonomous/examples`, { headers: authHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        const c = document.getElementById("examples");
        c.innerHTML = "";
        data.examples.forEach(ex => {
            const btn = document.createElement("button");
            btn.className = "example-btn";
            btn.textContent = ex.goal;
            btn.onclick = () => { document.getElementById("goalInput").value = ex.goal; };
            c.appendChild(btn);
        });
    } catch (e) { console.error(e); }
}

async function runAutonomous() {
    const goal = document.getElementById("goalInput").value.trim();
    if (!goal) return;

    const runBtn = document.getElementById("runBtn");
    const researchList = document.getElementById("researchList");

    runBtn.disabled = true;
    runBtn.textContent = "Calisiyor...";

    const cardId = "card-" + Date.now();
    const card = document.createElement("div");
    card.className = "research-card";
    card.id = cardId;
    card.innerHTML = `
        <div class="research-card-header">
            <div class="research-card-title">Hedef: ${escapeHtml(goal)}</div>
            <button class="research-card-delete" onclick="deleteCard('${cardId}')" title="Sil">x</button>
        </div>
        <div class="research-card-meta" id="${cardId}-meta">Plan olusturuluyor...</div>
        <div class="research-card-steps" id="${cardId}-steps"></div>
        <div id="${cardId}-report"></div>
    `;
    researchList.insertBefore(card, researchList.firstChild);

    try {
        const res = await fetch(`${API_BASE}/api/autonomous/stream`, {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ goal: goal, timeout: 120 })
        });
        if (!res.ok) {
            document.getElementById(`${cardId}-meta`).textContent = "Hata: " + res.status;
            runBtn.disabled = false; runBtn.textContent = "Calistir"; return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
                if (line.startsWith("data: ")) {
                    try { handleEvent(JSON.parse(line.slice(6)), cardId); }
                    catch (e) { console.error(e); }
                }
            }
        }
    } catch (e) {
        document.getElementById(`${cardId}-meta`).textContent = "Baglanti hatasi: " + e.message;
    }

    runBtn.disabled = false;
    runBtn.textContent = "Calistir";
    document.getElementById("goalInput").value = "";
    document.getElementById("goalInput").focus();
}

function handleEvent(data, cardId) {
    const meta = document.getElementById(`${cardId}-meta`);
    const stepsC = document.getElementById(`${cardId}-steps`);
    const reportC = document.getElementById(`${cardId}-report`);

    if (!meta) return;

    if (data.type === "planning") {
        meta.textContent = "Plan olusturuluyor...";
    }
    if (data.type === "plan_ready") {
        meta.textContent = `Plan hazir (${data.total_steps} adim)`;
        if (stepsC) {
            stepsC.innerHTML = "";
            data.steps.forEach(s => {
                const div = document.createElement("div");
                div.className = "research-card-step";
                div.id = `${cardId}-step-${s.step}`;
                div.textContent = `${s.step}. ${s.query} [${s.agent}]`;
                stepsC.appendChild(div);
            });
        }
    }
    if (data.type === "step_start") {
        const el = document.getElementById(`${cardId}-step-${data.step}`);
        if (el) el.textContent = `${data.step}. ${data.query} [CALISIYOR]`;
    }
    if (data.type === "step_done") {
        const el = document.getElementById(`${cardId}-step-${data.step}`);
        if (el) el.textContent = `${data.step}. Adim [BASARILI - ${data.duration_ms}ms]`;
    }
    if (data.type === "step_error") {
        const el = document.getElementById(`${cardId}-step-${data.step}`);
        if (el) el.textContent = `${data.step}. Adim [HATA]`;
    }
    if (data.type === "report_generating") {
        meta.textContent = "Rapor hazirlaniyor...";
    }
    if (data.type === "done") {
        meta.textContent = `Tamamlandi - ${(data.duration_ms / 1000).toFixed(1)}sn | ${data.steps_completed}/${data.total_steps} adim`;
        if (reportC) {
            reportC.innerHTML = `<div class="research-card-report">${escapeHtml(data.final_report)}</div>`;
        }
    }
    if (data.type === "error") {
        meta.textContent = "Hata: " + data.message;
    }
}

function deleteCard(cardId) {
    const card = document.getElementById(cardId);
    if (card) {
        card.style.opacity = "0.3";
        setTimeout(() => card.remove(), 200);
    }
}

function escapeHtml(text) {
    if (!text) return "";
    const div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
}

function temizle() {
    const input = document.getElementById("goalInput");
    if (input) { input.value = ""; input.focus(); }
    const researchList = document.getElementById("researchList");
    if (researchList) researchList.innerHTML = "";
    const runBtn = document.getElementById("runBtn");
    if (runBtn) { runBtn.disabled = false; runBtn.textContent = "Calistir"; }
}

document.getElementById("goalInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") runAutonomous();
});
loadExamples();
</script>

</body>
</html>
